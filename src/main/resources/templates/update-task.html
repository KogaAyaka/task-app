<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>タスク更新画面</title>
</head>

<body>

    <div class="container mt-5 w-50">
        <h2 class="d-flex justify-content-center align-items-center mb-4">タスク更新</h2>
    </div>

    <form th:action="@{/update-task/*{taskId}}" th:object="${taskForm}" method="post">

        <input type="hidden" th:field="*{taskId}">

        <div class="mb-3">
            <label class="form-label">タイトル</label>
            <input class="form-control" type="text" th:field="*{title}">
        </div>

        <div class="mb-3">
            <label class="form-label">内容</label>
            <textarea class="form-control" rows="5" th:field="*{description}"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">ステータス</label>
            <select class="form-select" th:field="*{status}">
                <option value="未着手">未着手</option>
                <option value="対応中">対応中</option>
                <option value="完了">完了</option>
            </select>
        </div>

        <button class="btn btn-outline-primary">更新</button>
    </form>
</body>

</html>
