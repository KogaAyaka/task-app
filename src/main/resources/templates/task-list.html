<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>タスク管理システム</title>
</head>

<body>
    <div class="container mt-5 w-75">
        <div class="d-flex justify-content-around align-items-center mb-3">
            <h2>タスク一覧</h2>
            <div class="d-flex gap-2">
                <form th:action="@{/task-list}" method="get" class="d-flex">
                    <input type="text" name="keyword" class="form-control me-2" placeholder="タイトル検索">
                    <select name="status" class="form-select me-2">

                        <option value="">すべて</option>
                        <option value="未着手">未着手</option>
                        <option value="対応中">対応中</option>
                        <option value="完了">完了</option>

                    </select>
                    <button type="submit" class="btn btn-outline-primary text-nowrap me-2">検索</button>
                </form>

                <a th:href="@{/create-task}" class="btn btn-outline-primary">
                    新規登録
                </a>

            </div>

        </div>

    </div>


    <div class="mt-3">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>タイトル</th>
                    <th>ステータス</th>
                    <th>更新日時</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${taskList}">
                    <td th:text="${item.taskId}">ID</td>
                    <td th:text="${item.title}">タイトル</td>
                    <td>
                        <span class="badge text-bg-success" th:if="${item.status == '完了'}"
                            th:text="${item.status}"></span>
                        <span class="badge text-bg-primary" th:if="${item.status == '対応中'}"
                            th:text="${item.status}"></span>
                        <span class="badge text-bg-secondary" th:if="${item.status != '完了' and item.status != '対応中'}"
                            th:text="${item.status}">
                        </span>
                    </td>
                    <td th:text="${item.updatedAt}">更新日時</td>
                    <td>
                        <a th:href="@{/update-task/{taskId}(taskId=${item.taskId})}" class="btn btn-outline-primary">
                            編集
                        </a>
                        <form th:action="@{/deleted-task/{taskId}(taskId=${item.taskId})}" method="post"
                            style="display:inline;">
                            <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal"
                                th:data-bs-target="|#deleteModal${item.taskId}|">
                                削除
                            </button>
                        </form>
                    </td>
                    <div class="modal fade" th:id="|deleteModal${item.taskId}|" tabindex="-1">

                        <div class="modal-dialog">
                            <div class="modal-content">

                                <div class="modal-header">
                                    <h5 class="modal-title">削除確認</h5>
                                </div>

                                <div class="modal-body">
                                    本当に削除しますか？
                                </div>

                                <div class="modal-footer">

                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                        キャンセル
                                    </button>

                                    <form th:action="@{/deleted-task/{taskId}(taskId=${item.taskId})}" method="post">

                                        <button type="submit" class="btn btn-danger">
                                            削除する
                                        </button>

                                    </form>

                                </div>

                            </div>
                        </div>

                    </div>
                </tr>
            </tbody>

        </table>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
